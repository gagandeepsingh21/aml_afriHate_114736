services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # the address of a deployed frontend that is allowed to call this API (optional)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3